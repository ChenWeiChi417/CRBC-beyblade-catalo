<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX系列商品一覽 - Beyblade X</title>
    <link rel="stylesheet" href="../static/style5.bx.css">
</head>
<body>
    <!-- 左上角回首頁按鈕 -->
    <a href="../index.html" class="home-btn">
        <img src="../static/HOME.png" alt="回首頁" class="home-icon-img">
    </a>

    <header>
        <img src="../static/logo_big.png" alt="戰鬥陀螺 X Logo" class="logo">
    </header>

    <div class="content-area">
        <div class="product-grid">
            <div class="product-card series-label-card scroll-fade">
                <div class="series-label-text">BX<br>SERIES</div>
            </div>
            <!-- 商品 1~11 -->
            <div class="product-card scroll-fade"><img src="../static/bx/bx01.png" alt="BX-01" class="prod-img"><div class="prod-title"><span>BX-01 蒼龍神劍</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx02.png" alt="BX-02" class="prod-img"><div class="prod-title"><span>BX-02 惡魔紅鐮</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx03.png" alt="BX-03" class="prod-img"><div class="prod-title"><span>BX-03 魔導幻箭</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx04.png" alt="BX-04" class="prod-img"><div class="prod-title"><span>BX-04 騎士重盾</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx05.png" alt="BX-05" class="prod-img"><div class="prod-title"><span>BX-05 魔導幻箭（焰紅）</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx06.png" alt="BX-06" class="prod-img"><div class="prod-title"><span>BX-06 騎士重盾（蒼藍）</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx07.png" alt="BX-07" class="prod-img"><div class="prod-title"><span>BX-07 極限激戰初始組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx08.png" alt="BX-08" class="prod-img"><div class="prod-title"><span>BX-08 三合一對戰組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx09.png" alt="BX-09" class="prod-img"><div class="prod-title"><span>BX-09 戰鬥陀螺x通行證</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx10.png" alt="BX-10" class="prod-img"><div class="prod-title"><span>BX-10 極限衝擊戰鬥盤</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/bx/bx11.png" alt="BX-11" class="prod-img"><div class="prod-title"><span>BX-11 發射器握把</span></div></div>
            <div class="product-card scroll-fade"><div class="prod-title"><span>敬請期待</span></div></div>
        </div>
        <div style="height: 200px;"></div>
    </div>

    <div class="char-scroll char-top"><img src="../static/x.png" alt="Top Character"></div>
    <div class="char-scroll char-mid"><img src="../static/Bird.png" alt="Mid Character"></div>
    <div class="char-scroll char-bot"><img src="../static/Multi.png" alt="Bot Character"></div>

    <div class="left-sidebar"></div>
    <div class="right-decoration">
        <div class="r-stripe r-blue"></div><div class="r-stripe r-black"></div><div class="r-stripe r-blue"></div>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target); 
                }
            });
        }, { threshold: 0.01, rootMargin: "0px 50% 10% 0px" });

        document.querySelectorAll('.char-scroll, .scroll-fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
