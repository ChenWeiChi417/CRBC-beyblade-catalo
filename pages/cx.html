<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CX系列商品一覽 - Beyblade X</title>
    <link rel="stylesheet" href="../static/style4.cx.css">
</head>
<body>
    <!-- 左上角回首頁按鈕 -->
    <a href="../index.html" class="home-btn">
        <img src="../static/HOME.png" alt="回首頁" class="home-icon-img">
    </a>

    <header>
        <img src="../static/logo_big.png" alt="戰鬥陀螺 X Logo" class="logo">
    </header>

    <div class="content-area">
        <div class="product-grid">
            <div class="product-card series-label-card scroll-fade">
                <div class="series-label-text">CX<br>SERIES</div>
            </div>
            <!-- 商品 1~11 -->
            <div class="product-card scroll-fade"><img src="../static/cx/cx01.png" alt="CX-01" class="prod-img"><div class="prod-title"><span>CX-01 蒼龍勇氣</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx02.png" alt="CX-02" class="prod-img"><div class="prod-title"><span>CX-02 魔導至尊</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx03.png" alt="CX-03" class="prod-img"><div class="prod-title"><span>CX-03 英仙幽冥</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx04.png" alt="CX-04" class="prod-img"><div class="prod-title"><span>CX-04 極限衝擊對戰組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx05.png" alt="CX-05" class="prod-img"><div class="prod-title"><span>CX-05 惡魔獵魂隨機強化組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx06.png" alt="CX-06" class="prod-img"><div class="prod-title"><span>CX-06 極狐九尾隨機強化組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx07.png" alt="CX-07" class="prod-img"><div class="prod-title"><span>CX-07 天馬爆擊</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx08.png" alt="CX-08" class="prod-img"><div class="prod-title"><span>CX-08 魔犬烈焰隨機強化組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx09.png" alt="CX-09" class="prod-img"><div class="prod-title"><span>CX-09 焰神滅世</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx10.png" alt="CX-10" class="prod-img"><div class="prod-title"><span>CX-10 銀狼狩獵</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/cx/cx11.png" alt="CX-11" class="prod-img"><div class="prod-title"><span>CX-11 帝王威能</span></div></div>
            <div class="product-card scroll-fade coming-soon"><div class="prod-title"><span>敬請期待</span></div></div>
        </div>
        <div style="height: 200px;"></div>
    </div>

    <div class="char-scroll char-top"><img src="../static/x.png" alt="Top Character"></div>
    <div class="char-scroll char-mid"><img src="../static/Bird.png" alt="Mid Character"></div>
    <div class="char-scroll char-bot"><img src="../static/Multi.png" alt="Bot Character"></div>

    <div class="left-sidebar"></div>
    <div class="right-decoration">
        <div class="r-stripe r-pink"></div><div class="r-stripe r-black"></div><div class="r-stripe r-pink"></div>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target); 
                }
            });
        }, { threshold: 0.01, rootMargin: "0px 50% 10% 0px" });
        document.querySelectorAll('.char-scroll, .scroll-fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
