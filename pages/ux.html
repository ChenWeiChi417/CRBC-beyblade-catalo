<!-- ========================================= -->
    <!-- 5. 滾動偵測腳本 (Scroll Trigger Script) -->
    <!-- ========================================= */ -->
    <script>
        // 1. 建立一個「交叉觀察器 (IntersectionObserver)」
        // 這是一個負責監控「元素是否進入視窗」的機器人
        const observer = new IntersectionObserver((entries) => {
            
            // 遍歷每一個被觀察的目標 (可能是人物，也可能是商品卡片)
            entries.forEach(entry => {
                
                // 檢查：如果該目標「正在交叉 (isIntersecting)」(也就是進入畫面範圍了)
                if (entry.isIntersecting) {
                    
                    // 動作：幫該元素加上 "active" 這個 class
                    // (加上 class 後，CSS 寫好的 transition/animation 就會開始執行)
                    entry.target.classList.add('active');
                    
                    // 優化效能：既然動畫已經觸發了，就叫觀察員「停止觀察」這個元素
                    // 這樣可以避免往回捲動時動畫重複閃爍，也能節省瀏覽器資源
                    observer.unobserve(entry.target); 
                }
            });
        }, {
            // --- 觀察器的設定選項 ---
            
            // 觸發門檻 (Threshold)：0.01 代表只要目標露出 1% 的面積，就算「看到了」
            threshold: 0.01,
            
            // 視窗邊界擴充 (Root Margin)：順序是「上、右、下、左」
            // "0px 50% 10% 0px" 的意思是：
            // 1. 往右邊多看 50% 的寬度 (這是為了抓到那些藏在右邊畫面外的人物)
            // 2. 往下面多看 10% 的高度 (讓商品在還沒完全捲上來時，就提早一點點開始浮現，感覺更流暢)
            rootMargin: "0px 50% 10% 0px"
        });

        // 2. 選取並觀察「人物」
        // 抓取所有 class 有 'char-scroll' 的元素 (X, Bird, Multi)
        const characters = document.querySelectorAll('.char-scroll');
        // 對每一個抓到的人物，叫觀察員開始盯著它
        characters.forEach(char => {
            observer.observe(char);
        });
        
        // 3. 選取並觀察「商品卡片」
        // 抓取所有 class 有 'scroll-fade' 的元素 (BX/UX/CX 商品格)
        const products = document.querySelectorAll('.scroll-fade');
        // 對每一個抓到的商品，叫觀察員開始盯著它
        products.forEach(prod => {
            observer.observe(prod);
        });
    </script>
