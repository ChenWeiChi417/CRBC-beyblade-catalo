<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX系列商品一覽 - Beyblade X</title>
    <link rel="stylesheet" href="../static/style6.ux.css">
</head>
<body>
    <!-- 左上角回首頁按鈕 -->
    <a href="../index.html" class="home-btn">
        <img src="../static/HOME.png" alt="回首頁" class="home-icon-img">
    </a>

    <header>
        <img src="../static/logo_big.png" alt="戰鬥陀螺 X Logo" class="logo">
    </header>

    <div class="content-area">
        <div class="product-grid">
            <div class="product-card series-label-card scroll-fade">
                <div class="series-label-text">UX<br>SERIES</div>
            </div>
            <!-- 商品 1~11 -->
            <div class="product-card scroll-fade"><img src="../static/ux/ux01.png" alt="UX-01" class="prod-img"><div class="prod-title"><span>UX-01 蒼龍爆刃</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux02.png" alt="UX-02" class="prod-img"><div class="prod-title"><span>UX-02 惡魔戰錘</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux03.png" alt="UX-03" class="prod-img"><div class="prod-title"><span>UX-03 魔導神杖</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux04.png" alt="UX-04" class="prod-img"><div class="prod-title"><span>UX-04 極限衝擊對戰組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux05.png" alt="UX-05" class="prod-img"><div class="prod-title"><span>UX-05 忍者闇影隨機強化組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux06.png" alt="UX-06" class="prod-img"><div class="prod-title"><span>UX-06 雄獅巔峰</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux07.png" alt="UX-07" class="prod-img"><div class="prod-title"><span>UX-07 鳳凰尾翼改造組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux08.png" alt="UX-08" class="prod-img"><div class="prod-title"><span>UX-08 霜輝銀狼</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux09.png" alt="UX-09" class="prod-img"><div class="prod-title"><span>UX-09 武士星劍豪華組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux10.png" alt="UX-10" class="prod-img"><div class="prod-title"><span>UX-10 騎士圓甲改造組</span></div></div>
            <div class="product-card scroll-fade"><img src="../static/ux/ux11.png" alt="UX-11" class="prod-img"><div class="prod-title"><span>UX-11 衝擊龍神豪華組</span></div></div>
            <div class="product-card scroll-fade"><div class="prod-title"><span>敬請期待</span></div></div>
        </div>
        <div style="height: 200px;"></div>
    </div>

    <div class="char-scroll char-top"><img src="../static/x.png" alt="Top Character"></div>
    <div class="char-scroll char-mid"><img src="../static/Bird.png" alt="Mid Character"></div>
    <div class="char-scroll char-bot"><img src="../static/Multi.png" alt="Bot Character"></div>

    <div class="left-sidebar"></div>
    <div class="right-decoration">
        <div class="r-stripe r-orange"></div><div class="r-stripe r-black"></div><div class="r-stripe r-orange"></div>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target); 
                }
            });
        }, { threshold: 0.01, rootMargin: "0px 50% 10% 0px" });
        document.querySelectorAll('.char-scroll, .scroll-fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
